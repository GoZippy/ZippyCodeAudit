<!DOCTYPE html>
<html>
<head>
    <title>Audit Report</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .header { background: #f0f0f0; padding: 20px; border-radius: 5px; }
        .section { margin: 20px 0; }
        .metric { display: inline-block; margin: 10px; padding: 10px; background: #e8f4f8; border-radius: 3px; }
        .issue { margin: 5px 0; padding: 5px; background: #ffe8e8; border-left: 3px solid #ff6b6b; }
        .recommendation { margin: 5px 0; padding: 5px; background: #e8f8e8; border-left: 3px solid #51cf66; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Audit Report - summary</h1>
        <p><strong>Generated:</strong> 10/11/2025, 9:30:01 PM</p>
        <p><strong>Project Health:</strong> Excellent</p>
    </div>

    <div class="section">
        <h2>Tech Stack</h2>
        <div class="metric">JavaScript/Node.js</div>
    </div>

    <div class="section">
        <h2>Metrics</h2>
        <div class="metric">Files: 0</div>
        <div class="metric">Lines: 0</div>
        <div class="metric">Size: 0KB</div>
    </div>

    <div class="section">
        <h2>Issues</h2>
        <div class="issue">[medium] No README file found</div>
    </div>

    <div class="section">
        <h2>Recommendations</h2>
        <div class="recommendation">Address Critical Issues<br><small>Found 1 issues that need immediate attention.</small></div>
    </div>
</body>
</html>
